x-timezone: &timezone
  TZ: ${TZ:-America/Santiago}

services:
  traefik:
    # >= 3.6.1: Docker 29 exige API >= 1.40/1.44; Traefik viejo habla 1.24 y falla.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal

  bd_main:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      <<: *timezone
      PGTZ: ${PGTZ:-America/Santiago}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - agenda_online_simple_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build: ./backend
    init: true
    env_file:
      - .env
    user: root
    entrypoint: ["/usr/local/bin/docker-entrypoint.dev.sh"]
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./backend/docker-entrypoint.dev.sh:/usr/local/bin/docker-entrypoint.dev.sh:ro
      - /app/node_modules
      # No montar /app/dist: Nest 12 hace rmdir de dist y falla con EBUSY si es volumen.
    command: sh -c "pnpm migrate && pnpm migrate:data && pnpm run start:dev"
    environment:
      <<: *timezone
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://agenda.localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.aos-api.rule=Host(`api.agenda.localhost`)
      - traefik.http.routers.aos-api.entrypoints=web
      - traefik.http.services.aos-api.loadbalancer.server.port=3000
    depends_on:
      bd_main:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    init: true
    user: root
    entrypoint: ["/usr/local/bin/docker-entrypoint.dev.sh"]
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "echo '' && echo '  Front → http://localhost:3001 | http://agenda.localhost' && echo '  API   → http://localhost:3000 | http://api.agenda.localhost' && echo '  Traefik dashboard → http://localhost:8080' && echo '' && pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"
    environment:
      <<: *timezone
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TRAEFIK_HTTP_PORT: ${TRAEFIK_HTTP_PORT:-80}
      TRAEFIK_DASHBOARD_PORT: ${TRAEFIK_DASHBOARD_PORT:-8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_BUSINESS_SLUG: ${NEXT_PUBLIC_DEFAULT_BUSINESS_SLUG:-barberia-demo}
    labels:
      - traefik.enable=true
      - traefik.http.routers.aos-front.rule=Host(`agenda.localhost`)
      - traefik.http.routers.aos-front.entrypoints=web
      - traefik.http.services.aos-front.loadbalancer.server.port=3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  agenda_online_simple_pg_data:
